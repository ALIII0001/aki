<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A cinematic portfolio featuring premium video work, motion stories, and visual direction."
    />
    <meta name="theme-color" content="#070707" />
    <title>Cinematic Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="site-shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero__media" aria-hidden="true">
          <video id="hero-video" class="hero__video" muted loop playsinline preload="metadata"></video>
          <div class="film-grain"></div>
        </div>
        <div class="hero__content">
          <p class="eyebrow">Director / Editor / Visual Storyteller</p>
          <h1 id="hero-title">Cinematic portfolio</h1>
          <p class="hero__copy">
            Premium visual work built for mood, rhythm, and impact.
          </p>
        </div>
      </section>

      <section class="work" aria-labelledby="work-title">
        <div class="section-heading">
          <p class="eyebrow">Selected work</p>
          <h2 id="work-title">Films that load when they enter the frame.</h2>
        </div>

        <div id="video-grid" class="video-grid" aria-live="polite">
          <article class="video-card video-card--skeleton">
            <div class="video-frame"></div>
            <div class="video-meta">
              <span></span>
              <strong></strong>
            </div>
          </article>
          <article class="video-card video-card--skeleton">
            <div class="video-frame"></div>
            <div class="video-meta">
              <span></span>
              <strong></strong>
            </div>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
